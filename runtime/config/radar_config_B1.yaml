/**:
  ros__parameters:
    ############ system configuration ############
    # Data logging
    log_to_file: true
    log_debug: true
    log_enabled: [
        ## ADD LOGGER IDS HERE
        # tactic
        "tactic",
        "tactic.pipeline",
        "tactic.module",
        # "tactic.module.live_mem_manager",
        # "tactic.module.graph_mem_manager",
        # pipeline specific
        "radar.pipeline",
        "radar.pc_extractor",
        "radar.conversion",
        "radar.preprocessing",
        # "radar.mcransac",
        # "radar.odometry_icp",
        # "radar.vertex_test",
        # "radar.localization_map_recall",
        # "radar.localization_icp",
      ]

    ############ Boreas data configuration ############
    boreas:
      radar_dir_name: "paper1_radar" # [radar, doppler_radar, range_corr_radar, az_doppler_radar]
      localization:
        reverse: false   # Whether to localize against a reversed map

    ############ tactic configuration ############
    tactic:
      enable_parallelization: false
      preprocessing_skippable: false
      odometry_mapping_skippable: false
      localization_skippable: false

      task_queue_num_threads: 1
      task_queue_size: -1

      chain:
        min_cusp_distance: 1.5
        angle_weight: 0.0 #set to 0 to prevent warnings when driving in reverse, used to be 7
        search_depth: 5
        search_back_depth: 10
        distance_warning: 30.0

      save_odometry_result: true
      save_odometry_vel_result: true
      save_localization_result: true
      visualize: true

      rviz_loc_path_offset: [0., 0., 0.]

    ############ pipeline configuration ############
    pipeline:
      type: radar

      preprocessing: [
          # preprocessing thread modules
          "conversion",
          "extraction",
          "filtering",
        ]

      odometry: [
          # odometry and mapping thread modules
          # "mcransac",
          "icp",
          "mapping",
          "vertex_test",
          "memory",
        ]

      localization: [
          # localization thread modules
          "recall",
          "icp",
          "memory",
        ]

      # submap creation thresholds
      submap_translation_threshold: 10.0 # in meters
      submap_rotation_threshold: 30.0 # in degrees
      # save raw pointclouds for training
      # can turn this off for testing
      save_raw_point_cloud: false

    preprocessing:
      conversion:
        type: radar.offline_converter
        cart_resolution: 0.2384 # m/pixel of BEV Cartesian radar image
        radar_resolution: 0.0596 #0.0596, 0.0438
        cartesian_maxr: 80.0 # maximum cartesian visualization distance
      extraction:
        type: radar.pc_extractor
        radar_resolution: 0.0438  
        range_offset: -0.31
        detector: kstrongest # choose detector \in (kstrongest, cen2018, cacfar, oscfar, modified_cacfar)
        minr: 2.0 # mininum detection distance
        maxr: 80.0 # maximum detection distance, old is 80
        # TODO: make cart_resolution an integer mult of radar_resolution
        cart_resolution: 0.2384 # m/pixel of BEV Cartesian radar image
        beta: 0.05024 # Doppler correction factor (set to 0 to turn this off). Old is 0.049
        upfront_range_corr: false  # whether to apply range correction upfront if azimuth velocities are present
                                    # this sets beta to 0 internally
        kstrongest:
          kstrong: 3 # k-strongest per azimuth to retain
          static_threshold: 0.35 # Try 0.25 for older Navtech firmware
        bfar:
          width: 101
          guard: 5
          threshold: 12.5
          static_threshold: 0.3

        visualize: true

      filtering:
        type: radar.preprocessing

        num_threads: 1 # number of threads for nearest neighbor search

        voxel_downsample: false
        frame_voxel_size: 1.0 # grid size for frame voxelization in meters

        window_size: 5.0 # number of neighboring azimuths used to compute line normal
        aximuth_res: 0.015707963267948967 # azimuth resolution in radians (0.1 in degree), giveng M=400
        rho_scale: 1.0 # when finding neighbors, set rho to log(rho) / rho_scale

        num_sample_linearity: 5000 # max number of sample after filtering based on linearity
        min_linearity_score: -1.0 # min linearity score (negative value means no filtering)

        visualize: true

    odometry:
      mcransac:
        type: radar.mcransac
        tolerance: 0.1225 # matched with squared error less than this are inliers
        inlier_ratio: 0.9 # ratio of inliers required for MC-RANSAC to break early
        iterations: 100 # Max number of RANSAC iterations
        max_gn_iterations: 10 # Max number of Gauss-Newton NLLS iterations
        epsilon_converge: 0.0001 # is norm(delta_w) < this, break out of Gauss-Newton
        descriptor: orb
        # ORB
        patch_size: 31 # patch size for ORB descriptor calculations
        nndr: 1.0 # Nearest Neighbor Distance Ratio test after ORB matching
        # BASD
        nbins: 16
        bin_size: 1
        visualize: true
        filter_pc: false
        init_icp: false

      icp:
        type: radar.odometry_icp

        # continuous time estimation
        use_trajectory_estimation: true
        traj_num_extra_states: 0
        traj_lock_prev_pose: true
        traj_lock_prev_vel: false
        traj_qc_diag: [1.0, 0.001, 0.0001, 0.001, 0.001, 0.01]
        #traj_qc_diag: [0.01, 0.00001, 0.0001, 0.0001, 0.0001, 0.001]

        # ICP parameters
        num_threads: 1
        first_num_steps: 2 # number of steps to with a greater matching distance threshold
        initial_max_iter: 4 # phase 1 max iterations
        initial_max_pairing_dist: 5.0 # phase 1 max pairing distance in meters
        initial_max_planar_dist: 5.0 # phase 1 max planar distance in meters
        refined_max_iter: 25 # phase 2 max iterations
        refined_max_pairing_dist: 5.0 # phase 2 max pairing distance in meters
        refined_max_planar_dist: 5.0 # phase 2 max planar distance in meters
        averaging_num_steps: 2 # averaging pose change over this number of steps until change is below a threshold at convergence
        huber_delta: 1.0 # huber loss threshold for ICP
        cauchy_k: 1.0 # cauchy loss threshold for ICP, should be 1.0 unless using both yaw and vel meas, 0.8 for N2
        use_p2pl: false
        w_icp_diag: [1.0, 1.0, 1.0]
        normal_score_threshold: 0.0


        # Doppler velocity parameters
        use_yaw_meas: false
        use_vel_meas: false
        use_radial_velocity: false
        dopp_cauchy_k: 100.0
        dopp_meas_std: 1.0
        vel_fwd_std: 0.4  # 0.6 for N1, 0.4 for N2
        vel_side_std: 1.0 # 1.2 for N1, 1.0 for N2
        yaw_cauchy_k: 100.0
        yaw_meas_std: 0.001 #0.2 for N1, 0.001 for B2?

        # steam parameters
        verbose: false
        max_iterations: 1

        # threshold
        min_matched_ratio: 0.0

        visualize: true

      mapping:
        type: radar.odometry_map_maintenance

        map_voxel_size: 1.0 # voxel size of the map in meters

        crop_range_front: 80.0 # odometry map crop range centered at vehicle in meters (radius of the odometry map, old is 80
        back_over_front_ratio: 1.0 # ratio of the back crop range to the front crop range (not important)

        point_life_time: 3.0 # point life time based on number of map updates

        visualize: true

      vertex_test:
        type: radar.vertex_test

        max_translation: 10.0 # translation threshold in meters
        max_rotation: 30.0 # rotation threshold in degrees

      memory:
        type: "live_mem_manager"

        window_size: 5 # unload data older than this many keyframes

    localization:
      recall:
        type: radar.localization_map_recall

        map_version: "pointmap"

        visualize: true

      icp:
        type: radar.localization_icp

        use_pose_prior: true

        # ICP parameters
        num_threads: 8
        first_num_steps: 2
        initial_max_iter: 4
        initial_max_pairing_dist: 5.0
        initial_max_planar_dist: 5.0
        refined_max_iter: 1000
        refined_max_pairing_dist: 5.0
        refined_max_planar_dist: 5.0
        averaging_num_steps: 5
        huber_delta: 1.0
        cauchy_k: 1.0

        # steam parameters
        verbose: false
        max_iterations: 1

        # threshold
        min_matched_ratio: 0.0

      memory:
        type: "graph_mem_manager"

        vertex_life_span: 5
        window_size: 3
