/**:
  ros__parameters:
    ############ system configuration ############
    # Data logging
    log_to_file: true
    log_debug: true
    log_enabled: [
        ## ADD LOGGER IDS HERE
        # tactic
        # "tactic",
        # "tactic.pipeline",
        "tactic.module",
        # "tactic.module.live_mem_manager",
        # "tactic.module.graph_mem_manager",
        # pipeline specific
        "radar.pipeline",
        "radar.pc_extractor",
        # "radar.doppler_extractor",
        "radar.conversion",
        "radar.preprocessing",
        "radar.odometry_icp",
        "radar.localization_map_recall",
        "radar.localization_icp",
        # "radar.odometry_dro",
        # "radar.scan_to_pointmap",
        # "radar.localization_drl",
        # "radar.mcransac",
        # "radar.odometry_gt",
        # "radar.odometry_wheel",
        # "radar.vertex_test",
        # "pose_graph",
      ]

    ############ Boreas data configuration ############
    boreas:
      radar_dir_name: "radar" # [radar, doppler_radar, range_corr_radar, az_doppler_radar]
      load_gt: false
      imu:
        use_imu: true
        imu_name: "dmu" # options are "dmu", "aeva", or "imu" (for applanix imu)
        force_wrap: false # if true, fabricate a bracketing IMU sample from the nearest real one when a scan can't be fully wrapped (e.g. at the start/end of a sequence)
      wheel_encoder:
        use_wheel_encoder: false
        encoder_max: 16777216 # 2^24
      odometry:
        start_frame: 0  # start frame for odometry
        end_frame: -1   # -1 means process all frames
      localization:
        reverse: false  # Whether to localize against a reversed map

    ############ tactic configuration ############
    tactic:
      enable_parallelization: false
      preprocessing_skippable: false
      odometry_mapping_skippable: false
      localization_skippable: false

      task_queue_num_threads: 1
      task_queue_size: -1

      chain:
        min_cusp_distance: 1.5
        angle_weight: 7.0
        search_depth: 5 # matches navtech_warthog_default (online) chain.search_depth
        search_back_depth: 10
        distance_warning: 5.0 # matches navtech_warthog_default (online) chain.distance_warning

      save_odometry_result: true
      save_odometry_vel_result: true
      save_localization_result: true
      visualize: false

      rviz_loc_path_offset: [0., 0., 0.]

    ############ pipeline configuration ############
    pipeline:
      type: radar

      preprocessing: [
          # preprocessing thread modules
          "conversion",
          "extraction",
          "filtering",
          # "doppler_extraction"
        ]

      odometry: [
          # odometry and mapping thread modules
          # "mcransac",
          "icp",
          # "dro",
          # "gt",
          # "wheel",
          "mapping",
          "vertex_test",
          # "scan_to_pointmap",
          "memory",
        ]

      localization: [
          # localization thread modules
          "recall",
          "icp",
          # "drl",
          "memory",
        ]

      # submap creation thresholds
      submap_translation_threshold: 1.5 # matches navtech_warthog_default (online) pipeline.submap_translation_threshold
      submap_rotation_threshold: 30.0 # in degrees
      # save raw pointclouds for training
      # can turn this off for testing
      save_raw_point_cloud: false

    preprocessing:
      conversion:
        type: radar.offline_converter
        cart_resolution: 0.2384 # m/pixel of BEV Cartesian radar image
        radar_resolution: 0.040308 # Warthog navtech radar resolution (matches navtech_warthog_default config)
        cartesian_maxr: 80.0 # maximum cartesian visualization distance
        # Warthog's Navtech RAS3 unit encodes 16000 counts/rotation (NOT
        # Boreas/Oxford's 5600 -- see warthog_boreas_converter/converter/radar.py).
        # Must match navtech_warthog_default.yaml's preprocessing.conversion.encoder_bin_size.
        encoder_bin_size: 16000
      extraction:
        type: radar.pc_extractor
        radar_resolution: 0.040308
        # radar_resolution: 0.0596
        range_offset: -0.220240 # matches navtech_warthog_default (online) extraction.range_offset
        detector: kstrongest # choose detector \in (kstrongest, cen2018, cacfar, oscfar, modified_cacfar)
        minr: 2.0 # mininum detection distance, matches navtech_warthog_default (online)
        maxr: 69.0 # maximum detection distance, matches navtech_warthog_default (online)
        # TODO: make cart_resolution an integer mult of radar_resolution
        cart_resolution: 0.2384 # m/pixel of BEV Cartesian radar image
        beta: 0.05 # Doppler correction factor (set to 0 to turn this off), matches navtech_warthog_default
        upfront_range_corr: false  # whether to apply range correction upfront if azimuth velocities are present
                                    # this sets beta to 0 internally
        kstrongest:
          kstrong: 5 # k-strongest per azimuth to retain, matches navtech_warthog_default (online)
          static_threshold: 0.3 # Try 0.25 for older Navtech firmware
        bfar:
          width: 101
          guard: 5
          # threshold: 15.0
          # static_threshold: 0.15
          threshold: 12.5
          static_threshold: 0.3
        modified_cacfar:
          width: 101
          guard: 5
          threshold: 12.5
          static_threshold: 0.3

        visualize: false

      doppler_extraction:
        type: radar.doppler_extractor
        radar:
          radar_res: 0.04381 # m/pixel, radar resolution
          f_t: 76.04E9    # Hz, start frequency ramp
          meas_freq: 1600.0 # Hz, number of measurements per second
          del_f: 893.0E6  # Hz, frequency span during ramp
        signal:
          min_range: 4.0    # m, minimum range of signal to use in cross-correlation
          max_range: 200.0  # m, maximum range of signal to use in cross-correlation
          beta_corr_fact: 0.944 # _, correction factor for beta
          pad_num: 100     # _, number of zeros to pad the signal with
        filter:
          sigma_gauss: 15.0 # _, standard deviation of Gaussian filter
          z_q: 2.5       # _, threshold for Cen2018 detector
        ransac:
          max_iter: 100
          threshold: 6.0
          prior_threshold: 600.0
        optimization:
          max_iter: 100
          threshold: 1.0E-6
          cauchy_rho: 0.8
          trim_dist: 1000.0
          x_bias_slope: -0.009 # m/s, slope of the bias correction in x direction
          x_bias_intercept: 0.10 # m/s, intercept of the bias correction in x direction
          y_bias_slope: 0.046 # m/s, slope of the bias correction in y direction
          y_bias_intercept: -0.11 # m/s, intercept of the bias correction in y direction


      filtering:
        type: radar.preprocessing

        num_threads: 2 # matches navtech_warthog_default (online) filtering.num_threads

        voxel_downsample: false
        frame_voxel_size: 1.0 # grid size for frame voxelization in meters

        window_size: 3.0 # matches navtech_warthog_default (online) filtering.window_size
        aximuth_res: 0.015707963267948967 # azimuth resolution in radians (0.1 in degree), giveng M=400
        rho_scale: 1.0 # when finding neighbors, set rho to log(rho) / rho_scale

        num_sample_linearity: 5000 # max number of sample after filtering based on linearity
        min_linearity_score: -1.0 # min linearity score (negative value means no filtering)

        visualize: false

    odometry:
      mcransac:
        type: radar.mcransac
        tolerance: 0.1225 # matched with squared error less than this are inliers
        inlier_ratio: 0.9 # ratio of inliers required for MC-RANSAC to break early
        iterations: 100 # Max number of RANSAC iterations
        max_gn_iterations: 10 # Max number of Gauss-Newton NLLS iterations
        epsilon_converge: 0.0001 # is norm(delta_w) < this, break out of Gauss-Newton
        descriptor: orb
        # ORB
        patch_size: 31 # patch size for ORB descriptor calculations
        nndr: 1.0 # Nearest Neighbor Distance Ratio test after ORB matching
        # BASD
        nbins: 16
        bin_size: 1
        visualize: false
        filter_pc: false
        init_icp: false

      dro:
        type: radar.odometry_dro

        direct:
          local_map_res: 0.1
          local_map_update_alpha: 0.25
          max_local_map_range: 80.0
          max_range: 69.0
          min_range: 2.0
          # Fixed blurring of DRO's local map
          gauss_blur_sigma: 3.0 # pixels, kernel size is (ceil(6 * sigma) | 1)
        estimation:
          estimate_vy_bias: false
          estimate_gyro_bias: true
          use_gyro: true
          vy_bias_prior: 0.11
          min_time_bias_init: 1.0
          gyro_bias_alpha: 0.01
          max_acceleration: 10.0
          # Constant ang vel bias for gyro-free operation, needs to be tuned.
          # Not used here since use_gyro is true.
          ang_vel_bias: 0.0
        gp:
          lengthscale_az: 1.0
          lengthscale_range: 1.0
          sz: 0.6
        radar:
          beta_corr_fact: 0.944
          del_f: 893.0E6
          ft: 76.04E9
          meas_freq: 1600.0
          range_offset: -0.32
          resolution: 0.040308
          doppler_enabled: false
          nb_azimuths: 400
        solver:
          nb_iter: 50
          cost_tol: 1.0E-4
          step_tol: 1.0E-4

        visualize: false

        # Manually controlled cap on torch's CPU thread usage for this DRO
        # instance (intra-op + inductor compile threads). Set <=0 (or omit)
        # to leave torch's default (all cores) -- lower this when running
        # several sequences in parallel (e.g. via run_parallel_test.sh) so
        # they don't all fight over every core.
        num_threads: 4

      gt:
        type: radar.odometry_gt
        num_threads: 1
        traj_qc_diag: [1.0, 0.001, 0.001]

      icp:
        type: radar.odometry_icp

        # continuous time estimation
        traj_num_extra_states: 0
        traj_qc_diag: [1.0, 0.001, 0.01] # matches navtech_warthog_default (online)

        # ICP parameters, matches navtech_warthog_default (online) unless noted
        num_threads: 2
        first_num_steps: 2 # number of steps to with a greater matching distance threshold
        initial_max_iter: 4 # phase 1 max iterations
        initial_max_pairing_dist: 1.5 # phase 1 max pairing distance in meters
        initial_max_planar_dist: 1.0 # phase 1 max planar distance in meters
        refined_max_iter: 50 # phase 2 max iterations
        refined_max_pairing_dist: 1.0 # phase 2 max pairing distance in meters
        refined_max_planar_dist: 0.3 # phase 2 max planar distance in meters
        averaging_num_steps: 5 # averaging pose change over this number of steps until change is below a threshold at convergence
        huber_delta: 1.0 # huber loss threshold for ICP
        cauchy_k: 1.0 # cauchy loss threshold for ICP, should be 1.0 unless using both yaw and vel meas, 0.8 for N2
        use_p2pl: false
        w_icp_diag: [1.0, 1.0]
        normal_score_threshold: 0.0
        remove_orientation: false

        # Gyro stuff
        gyro_cov: 1e-3 # matches navtech_warthog_default (online)
        estimate_gyro_bias: false

        # Doppler velocity parameters
        use_vel_meas: false
        dopp_cauchy_k: 1.0
        dopp_meas_std: 0.2
        vel_fwd_std: 0.6  # 0.6 for N1, 0.4 for N2
        vel_side_std: 1.2 # 1.2 for N1, 1.0 for N2
        doppler_bias: [0.10, -0.11] # [x_bias, y_bias] in m/s

        # steam parameters
        verbose: false
        max_iterations: 1

        # threshold
        min_matched_ratio: 0.40 # matches navtech_warthog_default (online)

        visualize: false

      wheel:
        type: radar.odometry_wheel

        num_threads: 1

        # wheel odometry parameters
        potentially_slipping: true
        estimate_bias: true
        bias_alpha: 0.005
        min_time_bias_count: 200.0   # 1 / median time diff between IMU measurements (applanix ~200Hz)
        wheel_parameter: 0.00052201 # 0.00052229
        wheel_cov: [0.001, 0.001, 0.001, 1e-7, 1e-7, 1e-7]

        visualize: false

      mapping:
        type: radar.odometry_map_maintenance

        map_voxel_size: 0.5 # matches navtech_warthog_default (online) mapping.map_voxel_size

        crop_range_front: 80.0 # odometry map crop range centered at vehicle in meters (radius of the odometry map, old is 80
        back_over_front_ratio: 1.0 # ratio of the back crop range to the front crop range (not important)

        point_life_time: 5.0 # matches navtech_warthog_default (online) mapping.point_life_time

        visualize: false

      scan_to_pointmap:
        type: radar.scan_to_pointmap
        map_resolution: 1.0 # submap voxel size in meters

        # Additional blurring on top of DRO's fixed gauss_blur_sigma blur,
        # applied only when building the submap (not for drl/localization)
        adaptive_blur: false # repeatedly re-blur until min_percent_nonzero of the scan is non-zero
        blur_sigma_step: 3.0 # fixed sigma applied on each re-blur pass
        max_num_reblur: 5 # cap on the number of re-blur passes
        min_int_val_tol: 0.5 # min intensity value to consider a pixel non-zero
        min_percent_nonzero: 0.3 # percent of pixels above min_int_val_tol to stop blurring

      vertex_test:
        type: radar.vertex_test

        max_translation: 0.2 # matches navtech_warthog_default (online) vertex_test.max_translation
        max_rotation: 10.0 # matches navtech_warthog_default (online) vertex_test.max_rotation

      memory:
        type: "live_mem_manager"

        window_size: 5 # unload data older than this many keyframes

    localization:
      recall:
        type: radar.localization_map_recall

        map_version: "pointmap"

        visualize: false

      icp:
        type: radar.localization_icp

        use_pose_prior: true

        # ICP parameters, matches navtech_warthog_default (online) unless noted
        num_threads: 1
        first_num_steps: 2
        initial_max_iter: 4
        initial_max_pairing_dist: 1.5
        initial_max_planar_dist: 1.0
        refined_max_iter: 50
        refined_max_pairing_dist: 1.0
        refined_max_planar_dist: 0.3
        averaging_num_steps: 5
        huber_delta: 1.0
        cauchy_k: 0.2 # matches navtech_warthog_default (online)
        w_icp_diag: [1.0, 1.0]

        # steam parameters
        verbose: false
        max_iterations: 3 # matches navtech_warthog_default (online)

        # threshold
        min_matched_ratio: 0.30 # matches navtech_warthog_default (online)

      drl:
        type: "radar.localization_drl"

        max_iterations: 25
        convergence_tol: 1.0e-4
        alpha: 1.0          # Gauss-Newton step size
        meas_std: 0.1       # intensity measurement noise std-dev (normalised [0,1] scale)
        range_factor: 0.0005   # adds range-dependent intensity uncertainty
        num_threads: 8

        use_pose_prior: false
        prior_cov_diag: [1e1, 1e1, 1e1]

      memory:
        type: "graph_mem_manager"

        vertex_life_span: 5
        window_size: 3
